name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Fügt den lokalen pip-Ordner zum PATH des Runners hinzu
      - name: Add Python scripts to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install JupyterLite & Build-Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install jupyterlite-core jupyterlite-pyodide-kernel "jupyterlab>=4.0.0,<5" hatch-jupyter-builder

      # Baut die Extension
      - name: Build & Install Obsidian Extension
        if: hashFiles('extension/package.json') != ''
        run: |
          cd extension
          npm install
          npm run build:lib
          python -m jupyter labextension build .
          python -m pip install .
          cd ..

      - name: Install Requirements
        run: |
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -d wheels ]; then python -m pip install ./wheels/*.whl 2>/dev/null || true; fi

      # Baut die JupyterLite-Instanz
      - name: Build JupyterLite Site
        run: |
          python -m jupyter lite build --contents content --output-dir dist

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
