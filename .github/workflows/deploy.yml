name: Deploy JupyterLite to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Berechtigungen für GitHub Pages und OIDC-Token
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Add Python scripts to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install JupyterLite & Build-Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install jupyterlite-core jupyterlite-pyodide-kernel "jupyterlab>=4.0.0,<5" hatch-jupyter-builder

      - name: Build & Install Obsidian Extension
        if: hashFiles('extension/package.json') != ''
        run: |
          cd extension
          npm install
          npm run build:lib
          python -m jupyter labextension build .
          mkdir -p jupyterlite_obsidian_markdown
          echo 'def _jupyter_labextension_paths(): return [{"src": "labextension", "dest": "jupyterlite-obsidian-markdown"}]' > jupyterlite_obsidian_markdown/__init__.py
          touch LICENSE README.md
          python -m pip install .
          cd ..

      # Installiere zuerst lokale Wheels und dann requirements.txt mit Verweis auf wheels/
      - name: Install Requirements
        run: |
          if [ -d wheels ]; then python -m pip install ./wheels/*.whl 2>/dev/null || true; fi
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt --find-links wheels || true; fi

      - name: Build JupyterLite Site
        run: |
          python -m jupyter lite build --contents content --output-dir dist

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4